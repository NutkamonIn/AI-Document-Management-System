services:
  # 1. Database: PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aidoc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aidoc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Local AI Engine: Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: aidoc_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
